name: DA/RAW Alert Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --prefix scripts

      - name: Run alert check
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node scripts/check-alert.mjs

      - name: Commit updated alert state
        run: |
          git config user.name "da-raw-bot"
          git config user.email "actions@users.noreply.github.com"
          git add alert-state.json
          git diff --staged --quiet || git commit -m "Update alert state"
          git push
        continue-on-error: true
